name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Sign Release APK (with debug key if no release key)
        run: |
          if [ -f "keystore/debug.keystore" ]; then
            APK_PATH=$(find . -name "*.apk" -path "*/release/*" | head -1)
            if [ -z "$APK_PATH" ]; then
              APK_PATH=$(find . -name "*.apk" | head -1)
            fi
            echo "APK found at: $APK_PATH"
          fi

      - name: Find APK files
        id: find_apk
        run: |
          DEBUG_APK=$(find . -name "*.apk" -path "*/debug/*" | head -1)
          RELEASE_APK=$(find . -name "*.apk" -path "*/release/*" | head -1)
          echo "debug_apk=$DEBUG_APK" >> $GITHUB_OUTPUT
          echo "release_apk=$RELEASE_APK" >> $GITHUB_OUTPUT
          echo "Debug APK: $DEBUG_APK"
          echo "Release APK: $RELEASE_APK"
          ls -la app/build/outputs/apk/ || true

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle | head -1 | sed 's/.*versionName "\(.*\)"/\1/' | tr -d ' ')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: MoviplexBD v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          body: |
            ## MoviplexBD 2026 - Auto Build Release
            
            Build: #${{ github.run_number }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            
            ### APK Files:
            - Debug APK: Ready to install (no signing needed)
            - Release APK: Signed with debug keystore
            
            ### Changes:
            ${{ github.event.head_commit.message }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
